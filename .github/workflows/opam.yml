name: Opam
on:
  push:
    branches: [main]
  pull_request:

# This will cancel previous runs when a branch or PR is updated
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        ocaml-compiler: [5.3.0]

    steps:
      - name: Setup node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          check-latest: true

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      # We use esy-bash as a build environment to keep the cygwin environment the same as esy
      - name: Checkout esy-bash
        uses: actions/checkout@v4
        with:
          repository: esy/esy-bash
          path: .tools/esy-bash

      - name: Setup esy-bash environment
        working-directory: .tools/esy-bash
        run: |
          npm i -g esy@0.9.2
          npm install
          npm run build-exe
          npm run build-cygwin
          npm link

      - name: Setup OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@93303b622b2522e4411e295f9e77411a24912ac7 # v3.9.0
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Inspect depexts
        run: |
          esy-bash opam exec -- which cmake
          esy-bash opam exec -- which gcc
          esy-bash opam exec -- which g++
          esy-bash opam exec -- gcc --version
          esy-bash opam exec -- g++ --version

      - name: Install local dependencies
        run: esy-bash opam install . --deps-only --with-test

      - name: Build project
        run: esy-bash opam exec -- dune build

      - name: Run tests
        run: esy-bash opam exec -- dune runtest --display=short
